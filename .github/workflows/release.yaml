name: Release Resume

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Resume
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "rendercv[full]"
          pip install -r requirements.txt

      - name: Generate merged RenderCV file
        run: python scripts/generate.py

      - name: Build resume
        run: |
          cd rendercv
          rendercv render cv.generated.yaml

      - name: Prepare release assets
        run: |
          mkdir release

          cp rendercv/rendercv_output/*.pdf release/Resume.pdf
          cp rendercv/rendercv_output/*.html release/Resume.html

          if ls rendercv/rendercv_output/*.md >/dev/null 2>&1; then
            cp rendercv/rendercv_output/*.md release/Resume.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Resume.pdf
            release/Resume.html
            release/Resume.md